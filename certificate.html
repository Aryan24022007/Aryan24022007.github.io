<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Raisen — Breaking an LLM Certificate</title><style>html,body{margin:0;min-height:100%;background:#05030b;color:#fff;font-family:Inter,system-ui,sans-serif}body{display:grid;place-items:center;padding:28px;box-sizing:border-box}.viewer{width:min(1100px,100%);text-align:center}.top{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:18px}.brand{font-size:12px;letter-spacing:.16em;color:#b9a9c9}.actions{display:flex;gap:10px}.btn{border:1px solid #8d5cff66;background:#0d0818;color:#fff;border-radius:999px;padding:10px 15px;cursor:pointer;font:inherit;font-size:12px}.btn:hover{border-color:#b98cff;background:#160d27}.certificate{width:100%;height:auto;display:block;border-radius:14px;box-shadow:0 20px 80px #000b,0 0 50px #8d43ff18}.loading{padding:80px;color:#b9a9c9;letter-spacing:.1em;font-size:13px}.error{padding:50px;color:#ff9aaf}@media(max-width:600px){body{padding:14px}.top{align-items:flex-start}.brand{font-size:10px}.btn{padding:8px 11px;font-size:11px}}</style></head><body><main class="viewer"><div class="top"><div class="brand">RAISEN / CERTIFICATE ARCHIVE</div><div class="actions"><button class="btn" id="print">PRINT / SAVE PDF</button><button class="btn" onclick="window.close()">CLOSE</button></div></div><div id="stage" class="loading">OPENING CERTIFICATE…</div></main><script>(async()=>{try{const parts=await Promise.all(["01","02","03","04","05"].map(n=>fetch("assets/cert-"+n+".txt",{cache:"force-cache"}).then(r=>{if(!r.ok)throw new Error("part "+n);return r.text()})));const img=document.createElement("img");img.className="certificate";img.alt="Aryan Kumar — Certificate of Participation for Breaking an LLM";img.src="data:image/jpeg;base64,"+parts.join("");const stage=document.getElementById("stage");stage.className="";stage.replaceWith(img);document.getElementById("print").addEventListener("click",()=>window.print())}catch(e){console.error(e);document.getElementById("stage").className="error";document.getElementById("stage").textContent="Certificate could not be loaded. Please refresh the page."}})();</script></body></html>
